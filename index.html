<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>Nilgiri Express – Rack &amp; Pinion Climb</title>
<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px}

}

</style></head><body>
<div id="top"><button id="bP" aria-label="Pause">⏸</button><button id="bM" aria-label="Mute">🔊</button></div>
<div id="rot">📱 Rotate your phone sideways for the best view</div>
<div id="wrap"><canvas id="c" width="900" height="500"></canvas>
<div id="ctl"><button id="bC">🔥 Shovel coal</button><button id="bB">🛑 Brake</button><button id="bW">📣 Whistle</button></div>
<p>Keyboard: hold <b>Space</b> = shovel · <b>B</b> = brake · <b>H</b> = whistle · <b>P</b> = pause · <b>M</b> = mute</p></div>
<script>
const C=document.getElementById('c'),g=C.getContext('2d'),W=900,H=500,L=7000;
const ST=[['Kallar',.17],['Coonoor',.45],['Wellington',.62],['Lovedale',.82],['Ooty',1]].map(a=>({n:a[0],x:a[1]*L,done:false,min:999}));
const TY=[{k:'a',n:'monkey',nm:'monkey',w:34},{k:'a',n:'goat',nm:'goat',w:50},{k:'r',n:'rock',nm:'boulder',w:76},{k:'r',n:'log',nm:'fallen log',w:84},{k:'r',n:'tree',nm:'fallen tree',w:44},{k:'r',n:'slide',nm:'landslide',w:100}];
let s,state='menu',last=0,K={},T={},shake=0,best=0;try{best=+localStorage.getItem('nilgiriBest')||0}catch(e){}
let AC,mg,nb,muted=false,ct=0,bt=0,sct=0,bkt=0,rt=0,EW,WG,paused=false;
const TUN=[[.28,420],[.51,500],[.72,400],[.9,450]].map(a=>({a:a[0]*L,b:a[0]*L+a[1],hit:false}));
function ainit(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=muted?0:.6;mg.connect(AC.destination);const n=AC.sampleRate;nb=AC.createBuffer(1,n,AC.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;const w=AC.createBufferSource(),wf=AC.createBiquadFilter();WG=AC.createGain();w.buffer=nb;w.loop=true;wf.type='bandpass';wf.frequency.value=600;WG.gain.value=0;w.connect(wf);wf.connect(WG);WG.connect(mg);w.start();EW=AC.createGain();EW.gain.value=0;const dl=AC.createDelay(1),fb=AC.createGain();dl.delayTime.value=.22;fb.gain.value=.45;mg.connect(EW);EW.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(AC.destination)}catch(e){AC=null}}
function tone(f,t,ty='sine',v=.2,f2){if(!AC)return;const o=AC.createOscillator(),q=AC.createGain(),n=AC.currentTime;o.type=ty;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+t);q.gain.setValueAtTime(v,n);q.gain.exponentialRampToValueAtTime(.001,n+t);o.connect(q);q.connect(mg);o.start(n);o.stop(n+t)}
function noise(t,f,v=.2,ty='bandpass'){if(!AC)return;const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),q=AC.createGain(),n=AC.currentTime;s.buffer=nb;fl.type=ty;fl.frequency.value=f;q.gain.setValueAtTime(v,n);q.gain.exponentialRampToValueAtTime(.001,n+t);s.connect(fl);fl.connect(q);q.connect(mg);s.start(n);s.stop(n+t)}
function loopSfx(dt,sh,br){
 ct-=dt;if(s.dsl){dUpd();if(ct<=0&&s.spd>2){ct=Math.max(.1,.55-s.spd/130);noise(.06,350,.1,'lowpass');tone(70,.05,'square',.06)}}else if(ct<=0&&s.spd>2){ct=Math.max(.16,.7-s.spd/85);noise(.13,s.p>90?1400:800,.16,'lowpass');tone(62+s.p*.3,.12,'sine',.28,40)}
 if(!s.dsl){rt-=dt;if(rt<=0&&s.spd>5){rt=Math.max(.05,.25-s.spd/700);tone(1900,.025,'square',.02)}}
 if(!s.dsl&&sh&&s.coal>0){sct-=dt;if(sct<=0){sct=.3;noise(.18,1500,.09)}}else sct=0;
 if(br&&s.spd>8){bkt-=dt;if(bkt<=0){bkt=.1;noise(.14,4200,.05,'highpass')}}
 if(s.p>90){bt-=dt;if(bt<=0){bt=.35;tone(1000,.12,'square',.05)}}
}
function spark(x,y,n,c){for(let i=0;i<n;i++)s.sp.push({x,y,vx:R(-120,120),vy:R(-200,-40),l:0,c})}
function togm(){muted=!muted;if(mg)mg.gain.value=muted?0:.6;bM.textContent=muted?'🔇':'🔊'}
function togp(){if(state==='play'){paused=!paused;if(AC)paused?AC.suspend():AC.resume()}}
function hold(fr,du,ty,v,cut,hiss){if(!AC)return;const n=AC.currentTime,q=AC.createGain(),fl=AC.createBiquadFilter(),lf=AC.createOscillator(),lg=AC.createGain();fl.type='lowpass';fl.frequency.value=cut;q.gain.setValueAtTime(.0001,n);q.gain.exponentialRampToValueAtTime(v,n+.06);q.gain.setValueAtTime(v,n+du-.25);q.gain.exponentialRampToValueAtTime(.001,n+du);lf.frequency.value=5.5;lg.gain.value=3;fr.forEach(f=>{const o=AC.createOscillator();o.type=ty;o.frequency.setValueAtTime(f*.96,n);o.frequency.linearRampToValueAtTime(f,n+.12);lg.connect(o.frequency);o.connect(fl);o.start(n);o.stop(n+du)});lf.connect(lg);lf.start(n);lf.stop(n+du);fl.connect(q);q.connect(mg);if(hiss)noise(du,hiss,.05)}
let DE=null;
function dStart(){if(!AC||DE)return;const n=AC.currentTime,o=AC.createOscillator(),o2=AC.createOscillator(),lf=AC.createOscillator(),lg=AC.createGain(),fl=AC.createBiquadFilter(),og=AC.createGain(),ot=AC.createOscillator(),tg=AC.createGain();o.type='sawtooth';o2.type='square';fl.type='lowpass';fl.frequency.value=260;og.gain.value=.1;lg.gain.value=.07;tg.gain.value=.004;o.connect(fl);o2.connect(fl);fl.connect(og);lf.connect(lg);lg.connect(og.gain);og.connect(mg);ot.connect(tg);tg.connect(mg);[o,o2,lf,ot].forEach(x=>x.start(n));DE={o,o2,lf,ot,tg,fl};dUpd()}
function dUpd(){if(!DE)return;const t=AC.currentTime,f=38+s.p*.55;DE.o.frequency.setTargetAtTime(f,t,.1);DE.o2.frequency.setTargetAtTime(f*1.5,t,.1);DE.lf.frequency.setTargetAtTime(6+s.p*.12,t,.1);DE.fl.frequency.setTargetAtTime(200+s.p*5,t,.1);DE.ot.frequency.setTargetAtTime(700+s.p*14,t,.1);DE.tg.gain.setTargetAtTime(.003+s.p*.00018,t,.1)}
function dStop(){if(!DE)return;try{[DE.o,DE.o2,DE.lf,DE.ot].forEach(x=>x.stop())}catch(e){}DE=null}
function swap(){s.dsl=true;s.p=Math.min(s.p,30);s.coal=100;s.hp=Math.min(100,s.hp+25);noise(.25,150,.5,'lowpass');tone(80,.25,'square',.3,50);setTimeout(()=>{if(s&&s.dsl&&state==='play')dStart()},500);say('🚉 Coonoor: steam engine detached – YDM4 diesel coupled!',3.5);document.getElementById('bC').textContent='⛽ Throttle';document.getElementById('bW').textContent='📣 Horn'}
function dieselDraw(){rr(-70,-80,44,66,4,'#2f7d46');rr(-24,-62,74,48,4,'#2f7d46');g.fillStyle='#f3e7c9';g.fillRect(-70,-40,120,8);g.fillRect(-70,-80,44,6);g.fillStyle='#8cc7ee';g.fillRect(-62,-70,28,18);g.fillStyle='#1d4d2c';g.fillRect(-24,-70,74,8);g.fillStyle='#222';g.fillRect(40,-60,10,26);g.fillStyle='#ffe98a';g.beginPath();g.arc(52,-50,5,0,7);g.fill();rr(-50,-14,80,8,3,'#1d1d22');g.fillStyle='#fff';g.font='bold 10px system-ui';g.textAlign='center';g.fillText('YDM4',10,-46);wheel(-48,-8,9);wheel(-18,-8,9);wheel(14,-8,9);wheel(40,-8,9)}

const R=(a,b)=>a+Math.random()*(b-a);
function say(m,t=2.2){s.msg=m;s.mt=t}
function reset(){
 s={dist:0,spd:0,p:35,coal:100,hp:100,score:0,time:0,msg:'',mt:0,wc:0,ws:0,stuck:0,ob:[],pk:[],puffs:[],sp:[],dsl:false,pax:0,pt:0,why:''};
 ST.forEach(t=>{t.done=false;t.min=999});TUN.forEach(u=>u.hit=false);
 for(let d=550;d<L-300;d+=R(260,480)*(1.2-.45*d/L)){if(ST.some(t=>Math.abs(t.x-d)<260)||TUN.some(u=>d>u.a-50&&d<u.b+50))continue;const t=TY[Math.floor(Math.random()*TY.length)];s.ob.push({x:d,k:t.k,n:t.n,nm:t.nm,w:t.w,t:0,sd:Math.random()*50})}
 for(let d=400;d<L-200;d+=R(380,560))s.pk.push({x:d,got:false});
}
function start(){ainit();paused=false;reset();dStop();if(EW)EW.gain.value=0;document.getElementById('bC').textContent='🔥 Shovel coal';document.getElementById('bW').textContent='📣 Whistle';state='play';say('Climb 2,200 m to Ooty! Keep steam in the green.',3)}
function whistle(){s.wc=1.2;s.ws=.5;if(s.tin&&!s.tin.hit){s.tin.hit=true;s.score+=100;say('📣 Echo through the tunnel! +100',2)}s.dsl?hold([370,466],1.2,'sawtooth',.13,1700,0):hold([392,494,587],1.3,'sawtooth',.11,2200,3500);let n=0;s.ob.forEach(o=>{const dx=o.x-s.dist;if(o.k==='a'&&!o.fly&&dx>360&&dx<640){o.fly=true;n++}});if(n){s.score+=50*n;say('📣 Phoooo! Animals scattered +'+50*n,1.5)}}
function end(win,why){dStop();state=win?'win':'over';(win?[523,659,784,1047]:[392,330,262,196]).forEach((q,i)=>setTimeout(()=>tone(q,.45,win?'triangle':'sawtooth',.2),i*160));s.why=why;if(win)s.score+=Math.round(s.hp*5+s.coal*2+Math.max(0,160-s.time)*10);s.score=Math.round(s.score);best=Math.max(best,s.score);try{localStorage.setItem('nilgiriBest',best)}catch(e){}}
function upd(dt){
 s.time+=dt;
 const sh=K[' ']||T.c,br=K.b||K.ArrowDown||T.b;loopSfx(dt,sh,br);
 const tc=s.dist+175,tu=TUN.find(q=>tc>q.a&&tc<q.b);if(!!tu!==!!s.tin){s.tin=tu||null;if(EW)EW.gain.setTargetAtTime(tu?.5:0,AC.currentTime,.1);if(tu)say('🚇 Tunnel! Sound the horn for an echo bonus',2.2)}
 if(WG)WG.gain.setTargetAtTime(Math.min(.1,Math.max(0,s.spd)/1500),AC.currentTime,.2);
 if(sh&&s.coal>0){s.p+=24*dt;s.coal=Math.max(0,s.coal-(s.dsl?2.2:3.2)*dt)}else s.p-=9*dt;
 s.p=Math.max(0,Math.min(110,s.p));
 s.spd+=(Math.max(-15,(s.p-20)*(s.dsl?1.8:1.6))-s.spd)*1.5*dt;
 if(br)s.spd=Math.max(0,s.spd-90*dt);
 s.dist=Math.max(0,s.dist+s.spd*dt);
 s.score+=Math.max(0,s.spd)*dt*.1;
 if(s.p>90){s.hp-=10*dt;if(s.mt<=0)say('🔥 Boiler overheating! Ease off the coal!',1)}
 if(s.p<15&&s.spd<5&&s.mt<=0&&s.coal>0)say('Low steam – shovel coal to climb!',1)
 s.wc-=dt;s.ws-=dt;s.mt-=dt;
 if((K.h||T.w)&&s.wc<=0)whistle();
 const fx=s.dist+350;
 for(const o of s.ob){
  if(o.gone)continue;
  if(o.fly){o.t+=dt*1.5;if(o.t>1)o.gone=true;continue}
  const d=o.x-o.w/2-fx;
  if(d<=0){o.fly=true;o.t=0;
   if(s.spd<35){tone(500,.08,'triangle',.1);s.score+=30;spark(fx,-10,6,dc(o));say('Gently nudged aside +30',1.2)}
   else{s.hp-=18;s.spd*=.3;shake=12;noise(.45,250,.5,'lowpass');tone(110,.4,'square',.25,40);spark(fx,-20,24,dc(o));spark(fx,-24,8,'#ffb347');if(o.n==='tree')spark(fx,-40,14,'#46a35a');say('💥 Crashed into a '+o.nm+'! Slow below 35 or whistle!',1.8)}}
 }
 for(const p of s.pk)if(!p.got&&Math.abs(p.x-s.dist-10)<25){p.got=true;s.coal=Math.min(100,s.coal+25);s.score+=20;tone(880,.1,'sine',.15);tone(1320,.18,'sine',.12);spark(s.dist+10,-24,10,'#ffd24a');say(s.dsl?'⛽ Diesel +25':'🔥 Coal collected +25',1)}
 ST.forEach((t,i)=>{
  if(t.done)return;
  if(i===1&&!s.dsl&&(s.dist>=t.x+120||(s.dist>t.x-40&&s.spd<8)))swap();
  if(i===4){if(s.dist>=L){t.done=true;end(true,'You reached Ooty, the Queen of Hills!')}return}
  if(s.dist>t.x-120&&s.dist<t.x+120)t.min=Math.min(t.min,s.spd);
  if(s.dist>=t.x+120){t.done=true;if(t.min<22){s.score+=400;s.pax+=Math.round(R(14,32));tone(1175,.9,'sine',.2);setTimeout(()=>tone(1175,.9,'sine',.2),320);say('🚉 '+t.n+': passengers boarded! +400',2.5)}else say('Missed the '+t.n+' platform! Brake earlier.',2.2)}
 });
 s.pt-=dt;if(s.pt<=0){s.pt=.09;s.puffs.push({x:s.dist+22,y:-76,l:0})}
 s.puffs.forEach(p=>{p.l+=dt;p.y-=28*dt});s.puffs=s.puffs.filter(p=>p.l<1.6);s.sp.forEach(p=>{p.l+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt});s.sp=s.sp.filter(p=>p.l<.7);
 if(s.coal<=0&&s.spd<1){s.stuck+=dt;if(s.stuck>3)end(false,'Out of coal – stranded on the slope!')}else s.stuck=0;
 if(s.hp<=0)end(false,'The boiler gave out. The mountain wins this time.');
}
function hill(par,base,amp,w,col){
 g.fillStyle=col;g.beginPath();g.moveTo(-900,900);
 for(let x=-900;x<=1400;x+=30){const q=(x+s.dist*par)/w;g.lineTo(x,-base-Math.sin(q)*amp-Math.sin(q*2.7)*amp*.3)}
 g.lineTo(1400,900);g.fill();if(par===.08)peak();else if(par===.2)falls();else if(par===.45)tea()
}
function rr(x,y,w,h,r,c){g.fillStyle=c;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}
function wheel(x,y,r){g.fillStyle='#222';g.beginPath();g.arc(x,y,r,0,7);g.fill();g.strokeStyle='#ddd';g.lineWidth=1.5;const a=s.dist/r;for(let i=0;i<3;i++){g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a+i*2.09)*r*.85,y+Math.sin(a+i*2.09)*r*.85);g.stroke()}}
const dc=o=>o.k==='a'?'#e0c29c':o.n==='rock'?'#b8b3aa':o.n==='slide'?'#9a7448':'#8a5a2e';
function elp(x,y,a,b,c,r,n){g.beginPath();g.ellipse(x,y,a,b,r||0,0,7);g.fillStyle=c;g.fill();if(!n){g.lineWidth=1.5;g.strokeStyle='rgba(20,12,6,.7)';g.stroke()}}
function shade(w){g.fillStyle='rgba(0,0,0,.32)';g.beginPath();g.ellipse(0,2,w*.58,5,0,0,7);g.fill()}
function stone(x,y,r,sd,c){g.beginPath();for(let i=0;i<9;i++){const a=i*.698,k=r*(.8+.2*Math.abs(Math.sin(sd*7+i*2.3))),px=x+Math.cos(a)*k,py=y-r*.8+Math.sin(a)*k*.8;i?g.lineTo(px,py):g.moveTo(px,py)}g.closePath();
 const gr=g.createLinearGradient(x-r,y-r*1.6,x+r,y);gr.addColorStop(0,'#d6d1c8');gr.addColorStop(.5,c||'#8d8a85');gr.addColorStop(1,'#4a4744');g.fillStyle=gr;g.fill();g.lineWidth=2;g.lineJoin='round';g.strokeStyle='#2b2926';g.stroke();
 g.strokeStyle='rgba(30,28,26,.5)';g.lineWidth=1.5;g.beginPath();g.moveTo(x-r*.2,y-r*1.3);g.lineTo(x+r*.05,y-r*.8);g.lineTo(x-r*.15,y-r*.4);g.stroke();
 elp(x-r*.35,y-r*1.15,r*.28,r*.12,'rgba(255,255,255,.4)',-.6,1);elp(x+r*.3,y-r*.18,r*.38,r*.12,'#5f8f45',0,1)}
function logD(w){const h=26,y=-h-2,gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,'#a77547');gr.addColorStop(.55,'#6b4426');gr.addColorStop(1,'#3a2413');
 g.beginPath();g.roundRect(-w/2,y,w,h,10);g.fillStyle=gr;g.fill();g.lineWidth=2;g.strokeStyle='#24150b';g.stroke();
 g.strokeStyle='rgba(30,16,6,.55)';g.lineWidth=1.5;for(let i=0;i<4;i++){g.beginPath();g.moveTo(-w/2+10,y+5+i*5);g.lineTo(w/2-16,y+6+i*5-(i%2)*3);g.stroke()}
 g.fillStyle='#6b4426';g.fillRect(-w*.22,y-11,8,13);g.fillRect(w*.1,y-7,7,9);
 elp(-w*.22+4,y-14,10,6,'#2f8f4a',-.5);elp(-w*.22-6,y-9,8,5,'#3d9150',.4);
 elp(w/2-5,y+h/2,6,h/2-1,'#dfbb85');elp(w/2-5,y+h/2,3,h/4,'rgba(120,80,40,.6)',0,1)}
function treeD(){g.save();g.rotate(-.26);g.lineJoin='round';
 g.beginPath();g.moveTo(-11,0);g.lineTo(-5,-100);g.lineTo(5,-100);g.lineTo(12,0);g.closePath();const gr=g.createLinearGradient(-11,0,12,0);gr.addColorStop(0,'#4a2f1a');gr.addColorStop(.5,'#8a5a33');gr.addColorStop(1,'#4a2f1a');g.fillStyle=gr;g.fill();g.lineWidth=2;g.strokeStyle='#24150b';g.stroke();
 g.strokeStyle='rgba(30,16,6,.5)';g.beginPath();g.moveTo(-2,-8);g.lineTo(-1,-90);g.moveTo(4,-10);g.lineTo(3,-70);g.stroke();
 g.strokeStyle='#1c3b25';[[-28,-106,24,'#2a6b3c'],[26,-110,22,'#2f7a44'],[0,-132,28,'#3d9150'],[-8,-100,22,'#35834a'],[16,-96,18,'#2a6b3c']].forEach(q=>{g.beginPath();g.arc(q[0],q[1],q[2],0,7);g.fillStyle=q[3];g.fill();g.stroke()});
 elp(-12,-140,10,6,'rgba(190,240,170,.55)',-.4,1);elp(-34,-116,7,4,'rgba(190,240,170,.45)',-.5,1);g.restore();elp(0,-3,24,7,'#6e4f31')}
function slideD(){g.beginPath();g.moveTo(-50,0);g.bezierCurveTo(-36,-18,-20,-36,0,-38);g.bezierCurveTo(20,-36,36,-16,52,0);g.closePath();
 const gr=g.createLinearGradient(0,-38,0,0);gr.addColorStop(0,'#b08a5e');gr.addColorStop(1,'#6e4f31');g.fillStyle=gr;g.fill();g.lineWidth=2;g.strokeStyle='#33200f';g.stroke();
